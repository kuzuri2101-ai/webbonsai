<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chia sẻ cây | Cây Sao Rồi?</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Newsreader:wght@600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0b1712;--panel:#f7f3e9;--ink:#203027;--muted:#68746d;--green:#173d2d;--accent:#a9c79b;--line:#d6dad3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:'Be Vietnam Pro',sans-serif;display:grid;place-items:center;padding:25px}.card{width:min(680px,100%);background:var(--panel);color:var(--ink);border-radius:28px;padding:42px;box-shadow:0 25px 70px #0006}.back{color:#5c6961;text-decoration:none;font-size:13px}.card h1{font:700 48px/1 Newsreader,serif;margin:18px 0 8px}.intro{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:16px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fffefa;padding:13px 14px;font:inherit;color:var(--ink);outline:none}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus{border-color:#315f46;box-shadow:0 0 0 4px #315f4618}.check{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--muted);margin:4px 0 18px}.check input{width:auto}.submit{width:100%;height:52px;border:0;border-radius:12px;background:var(--green);color:white;font-weight:800;cursor:pointer}.message{text-align:center;min-height:18px;margin-top:13px;font-size:12px;color:#315f46}.error{color:#b64c40}.login{font-size:12px;text-align:center;color:var(--muted);margin-top:20px}.login a{color:#315f46;font-weight:800}@media(max-width:600px){body{padding:0}.card{min-height:100vh;border-radius:0;padding:28px 22px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.card h1{font-size:40px}}</style></head><body><main class="card"><a class="back" href="community.html">← Về cộng đồng</a><h1>Chia sẻ cây 🌱</h1><p class="intro">Đăng cây bạn đang chăm để mọi người cùng xem. Bạn có thể chỉnh sửa hoặc xoá cây của mình sau này.</p><div id="config" class="message"></div><form id="form" style="display:none"><div class="grid"><div class="field"><label for="name">Tên cây *</label><input id="name" required placeholder="Ví dụ: Sanh mini"></div><div class="field"><label for="species">Loài cây</label><input id="species" placeholder="Ví dụ: Ficus microcarpa"></div><div class="field full"><label for="image">Link ảnh cây</label><input id="image" type="url" placeholder="https://..."></div><div class="field full"><label for="description">Giới thiệu</label><textarea id="description" placeholder="Cây này bao nhiêu tuổi, bạn chăm thế nào..."></textarea></div></div><label class="check"><input id="public" type="checkbox" checked> Hiển thị cây này trên trang Cộng đồng</label><button class="submit">Đăng cây lên cộng đồng</button><div id="message" class="message"></div></form><p id="login" class="login" hidden>Bạn cần <a href="login.html">đăng nhập</a> để chia sẻ cây.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const form=document.getElementById('form'),msg=document.getElementById('message'),config=document.getElementById('config'),login=document.getElementById('login');
(async()=>{if(!window.supabaseReady){config.textContent='Chưa kết nối Supabase. Hãy cấu hình supabase-config.js trước.';config.className='message error';return}const sb=getSupabase();const {data:{user}}=await sb.auth.getUser();if(!user){login.hidden=false;return}form.style.display='block';config.textContent='Đang đăng bằng tài khoản '+(user.email||'của bạn')+'.';})();
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='message';msg.textContent='Đang đăng…';const sb=getSupabase();const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const payload={user_id:user.id,name:document.getElementById('name').value.trim(),species:document.getElementById('species').value.trim()||null,image_url:document.getElementById('image').value.trim()||null,description:document.getElementById('description').value.trim()||null,is_public:document.getElementById('public').checked};if(!payload.name){msg.textContent='Hãy nhập tên cây.';msg.classList.add('error');return}const {error}=await sb.from('plants').insert(payload);if(error){msg.textContent='Không đăng được: '+error.message;msg.classList.add('error');return}msg.textContent='Đã chia sẻ cây thành công!';form.reset();document.getElementById('public').checked=true;setTimeout(()=>location.href='community.html',900)});
</script></body></html>
