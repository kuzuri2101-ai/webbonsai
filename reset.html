<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt lại mật khẩu | Cây Sao Rồi?</title><style>body{margin:0;min-height:100vh;background:#0b1712;display:grid;place-items:center;font-family:Arial,sans-serif;padding:20px}.card{width:min(430px,100%);background:#f7f3e9;padding:38px;border-radius:25px;color:#203027}h1{font-family:Georgia,serif;font-size:40px;margin:15px 0}p{color:#68746d;font-size:13px;line-height:1.6}input{width:100%;height:50px;box-sizing:border-box;border:1px solid #d6dad3;border-radius:12px;padding:0 14px;margin:8px 0 14px}button{width:100%;height:50px;border:0;border-radius:12px;background:#173d2d;color:white;font-weight:800;cursor:pointer}.msg{text-align:center;font-size:12px;color:#315f46;margin-top:12px}.error{color:#b64c40}a{color:#315f46;font-weight:700}</style></head><body><main class="card"><a href="login.html">← Quay lại đăng nhập</a><h1>Mật khẩu mới</h1><p>Nhập mật khẩu mới cho tài khoản của bạn.</p><form id="form"><input id="password" type="password" minlength="6" placeholder="Mật khẩu mới" required><input id="password2" type="password" minlength="6" placeholder="Nhập lại mật khẩu" required><button>Đổi mật khẩu</button><div id="msg" class="msg"></div></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const f=document.getElementById('form'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();m.className='msg';const p=password.value;if(p.length<6||p!==password2.value){m.textContent='Mật khẩu phải từ 6 ký tự và hai ô phải giống nhau.';m.classList.add('error');return}if(!window.supabaseReady){m.textContent='Chưa cấu hình Supabase.';m.classList.add('error');return}const {error}=await getSupabase().auth.updateUser({password:p});if(error){m.textContent=error.message;m.classList.add('error');return}m.textContent='Đổi mật khẩu thành công. Đang chuyển đến đăng nhập…';setTimeout(()=>location.href='login.html',1000)});</script></body></html>
