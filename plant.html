<!DOCTYPE html><html lang="vi" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta id="meta-desc" name="description" content="Hồ sơ cây bonsai"><title id="page-title">Hồ sơ cây | Cây Sao Rồi?</title><link rel="stylesheet" href="styles.css"><style>.profile-page{padding:70px 0 100px}.profile-wrap{max-width:1050px;margin:auto}.crumb{font-size:11px;color:var(--moss)}.profile-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:20px}.profile-main,.profile-side,.profile-section{border:1px solid var(--line);border-radius:28px;background:var(--card);padding:32px}.profile-main h1{font:700 clamp(52px,7vw,92px)/.95 Newsreader,serif;letter-spacing:-.05em;margin:12px 0}.profile-main h1 em{color:var(--sage);font-style:normal}.latin{color:var(--muted);font-style:italic}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}.fact{padding:16px;border-radius:16px;background:var(--card2)}.fact b{display:block;font-size:10px}.fact span{display:block;color:var(--muted);font-size:11px;margin-top:5px}.profile-section{margin-top:18px}.profile-section h2{font:700 34px Newsreader,serif;margin:0 0 14px}.profile-section p,.profile-section li{color:var(--muted);font-size:13px;line-height:1.7}.symptoms{display:flex;flex-wrap:wrap;gap:9px}.symptoms a{padding:9px 12px;border-radius:999px;background:var(--card2);color:inherit;text-decoration:none;font-size:11px}.faq details{border-top:1px solid var(--line);padding:15px 0}.faq summary{cursor:pointer;font-weight:700}.error{padding:60px;text-align:center;color:var(--muted)}@media(max-width:760px){.profile-hero{grid-template-columns:1fr}.facts{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><span class="brand-symbol">C</span><span class="brand-copy"><strong>Cây Sao Rồi?</strong><small>Hiểu cây trước khi chăm cây</small></span></a><nav class="desktop-nav"><a href="index.html">Trang chủ</a><a href="cay-bonsai.html">Thư viện cây</a><a href="cap-cuu-cay.html">Cấp cứu cây</a><a href="lab.html">Bonsai Lab</a></nav></div></header><main class="profile-page"><div class="page-shell profile-wrap" id="app"></div></main><script src="data/plants.js"></script><script>const slug=new URLSearchParams(location.search).get('slug'),p=window.PLANTS.find(x=>x.slug===slug),app=document.querySelector('#app');if(!p){app.innerHTML='<div class="error">Không tìm thấy hồ sơ cây. <a href="cay-bonsai.html">Quay lại thư viện</a></div>'}else{document.title=p.name+' — cách chăm sóc, bệnh và môi trường | Cây Sao Rồi?';document.querySelector('#meta-desc').content=`Hồ sơ ${p.name}: ${p.scientific}. Tra cứu ánh sáng, nước, giá thể, độ khó, triệu chứng và cách chăm sóc.`;app.innerHTML=`<div class="crumb">Thư viện cây → ${p.name}</div><div class="profile-hero"><section class="profile-main"><div class="eyebrow">Plant Profile</div><h1>${p.name}<br><em>hiểu cây từ gốc.</em></h1><div class="latin">${p.scientific}</div><div class="facts"><div class="fact"><b>☀ Ánh sáng</b><span>${p.light}</span></div><div class="fact"><b>💧 Nước</b><span>${p.water}</span></div><div class="fact"><b>🌱 Giá thể</b><span>${p.soil}</span></div><div class="fact"><b>◉ Độ khó</b><span>${p.difficulty}</span></div></div></section><aside class="profile-side"><div class="eyebrow">Tóm tắt</div><p>${p.care[0]}</p><p>${p.care[1]}</p><a class="button primary" href="cap-cuu-cay.html">→ Cấp cứu cây</a></aside></div><section class="profile-section"><h2>Chăm sóc thực tế</h2><ul>${p.care.map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="profile-section"><h2>Các vấn đề liên quan</h2><div class="symptoms">${p.symptoms.map(s=>`<a href="${s.url}">${s.name} →</a>`).join('')}</div></section><section class="profile-section"><h2>Phong thủy & văn hóa</h2><p>${p.feng}</p></section><section class="profile-section faq"><h2>Câu hỏi thường gặp</h2>${p.faq.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}</section></div>`}</script><script src="script.js"></script></body></html>
