<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1f18"><title>Đăng ký | Cây Sao Rồi?</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Newsreader:wght@600;700&display=swap" rel="stylesheet"><style>:root{--green:#173d2d;--green2:#315f46;--cream:#f7f3e9;--ink:#203027;--muted:#68746d;--line:#d6dad3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1712;font-family:'Be Vietnam Pro',sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(500px,100%);background:var(--cream);border-radius:28px;padding:42px;color:var(--ink);box-shadow:0 25px 70px #0006}.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);font-weight:800;margin-bottom:35px}.logo{width:42px;height:42px;border-radius:13px;background:var(--green);color:white;display:grid;place-items:center;font:22px Newsreader,serif}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--green2);font-weight:800}.card h1{font:700 42px/1 Newsreader,serif;margin:12px 0}.intro{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:28px}.field{margin-bottom:17px}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}input{width:100%;height:51px;border:1px solid var(--line);border-radius:12px;background:#fffefa;padding:0 15px;font:inherit;outline:0}input:focus{border-color:var(--green2);box-shadow:0 0 0 4px #315f4618}.submit{width:100%;height:52px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:800;cursor:pointer;margin-top:5px}.terms{font-size:11px;color:#7b847e;line-height:1.6;margin:14px 0}.login{text-align:center;color:var(--muted);font-size:13px;margin:22px 0 0}.login a{color:var(--green2);font-weight:800}.message{min-height:18px;text-align:center;font-size:12px;color:var(--green2);margin-top:12px}.error{color:#b64c40}@media(max-width:520px){body{padding:0}.card{min-height:100vh;border-radius:0;padding:30px 22px}}</style></head><body><main class="card"><a class="brand" href="index.html"><span class="logo">C</span><span>Cây Sao Rồi?</span></a><span class="eyebrow">Tham gia cộng đồng</span><h1>Tạo tài khoản 🌱</h1><p class="intro">Tạo tài khoản miễn phí để lưu cây, chia sẻ cây của bạn và tham gia cộng đồng.</p><form id="signup-form"><div class="field"><label>Tên hiển thị</label><input id="name" autocomplete="name" placeholder="Ví dụ: Minh Anh" required></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="ban@example.com" required></div><div class="field"><label>Mật khẩu</label><input id="password" type="password" autocomplete="new-password" placeholder="Ít nhất 6 ký tự" required></div><div class="field"><label>Nhập lại mật khẩu</label><input id="password2" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required></div><p class="terms">Bằng việc đăng ký, bạn đồng ý với điều khoản sử dụng và chính sách riêng tư của Cây Sao Rồi?.</p><button class="submit">Tạo tài khoản</button><div class="message" id="message"></div></form><p class="login">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const form=document.getElementById('signup-form'),msg=document.getElementById('message');
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='message';const p=document.getElementById('password').value,p2=document.getElementById('password2').value;if(p.length<6){msg.textContent='Mật khẩu cần ít nhất 6 ký tự.';msg.classList.add('error');return}if(p!==p2){msg.textContent='Hai mật khẩu chưa giống nhau.';msg.classList.add('error');return}if(!window.supabaseReady){msg.textContent='Chưa kết nối hệ thống tài khoản. Hãy cấu hình Supabase trước.';msg.classList.add('error');return}msg.textContent='Đang tạo tài khoản…';const sb=getSupabase();const {data,error}=await sb.auth.signUp({email:document.getElementById('email').value.trim(),password:p,options:{data:{display_name:document.getElementById('name').value.trim()},emailRedirectTo:location.origin+'/login.html'}});if(error){msg.textContent=error.message;msg.classList.add('error');return}if(data.session){location.href='account.html';return}msg.textContent='Tạo tài khoản thành công. Hãy kiểm tra email để xác nhận rồi đăng nhập.'});
</script></body></html>
