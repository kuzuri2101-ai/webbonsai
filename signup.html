<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0d1f18"><title>Đăng ký | Cây Sao Rồi?</title>
<style>
:root{--green:#173d2d;--green2:#315f46;--cream:#f7f3e9;--ink:#203027;--muted:#68746d;--line:#d6dad3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1712;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(480px,100%);background:var(--cream);border-radius:28px;padding:42px;color:var(--ink);box-shadow:0 25px 70px #0006}.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);font-weight:800;margin-bottom:35px}.logo{width:42px;height:42px;border-radius:13px;background:var(--green);color:white;display:grid;place-items:center;font-size:22px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--green2);font-weight:800}.card h1{font-family:Georgia,serif;font-size:42px;line-height:1;margin:12px 0}.intro{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:28px}.field{margin-bottom:17px}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}input{width:100%;height:51px;border:1px solid var(--line);border-radius:12px;background:#fffefa;padding:0 15px;font:inherit;outline:0}input:focus{border-color:var(--green2);box-shadow:0 0 0 4px #315f4618}.submit{width:100%;height:52px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:800;cursor:pointer;margin-top:5px}.terms{font-size:11px;color:#7b847e;line-height:1.6;margin:14px 0}.terms a,.login a{color:var(--green2);font-weight:700}.login{text-align:center;color:var(--muted);font-size:13px;margin:22px 0 0}.message{min-height:18px;text-align:center;font-size:12px;color:var(--green2);margin-top:12px}.message.error{color:#b64c40}@media(max-width:520px){body{padding:0}.card{min-height:100vh;border-radius:0;padding:30px 22px}}
</style></head>
<body><main class="card"><a class="brand" href="index.html"><span class="logo">C</span><span>Cây Sao Rồi?</span></a><span class="eyebrow">Tham gia cộng đồng</span><h1>Tạo tài khoản 🌱</h1><p class="intro">Lưu những cây bạn đang chăm, bài viết yêu thích và chuẩn bị lịch chăm sóc riêng.</p>
<form id="signup-form"><div class="field"><label for="name">Tên hiển thị</label><input id="name" autocomplete="name" placeholder="Ví dụ: Minh Anh" required></div><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="ban@example.com" required></div><div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="new-password" placeholder="Ít nhất 6 ký tự" required></div><div class="field"><label for="password2">Nhập lại mật khẩu</label><input id="password2" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required></div><p class="terms">Bằng việc đăng ký, bạn đồng ý với điều khoản sử dụng và chính sách riêng tư của Cây Sao Rồi?.</p><button class="submit">Tạo tài khoản</button><div class="message" id="message"></div></form><p class="login">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p></main>
<script>document.getElementById('signup-form').addEventListener('submit',e=>{e.preventDefault();const m=document.getElementById('message'),p=document.getElementById('password').value,p2=document.getElementById('password2').value;m.className='message';if(p.length<6){m.textContent='Mật khẩu cần ít nhất 6 ký tự.';m.classList.add('error');return}if(p!==p2){m.textContent='Hai mật khẩu chưa giống nhau.';m.classList.add('error');return}m.textContent='Giao diện đăng ký đã nhận thông tin. Cần kết nối backend để tạo tài khoản thật.'});</script></body></html>
